# VPN Hub — pgBackRest (design Section 4.5)
# Layer 2: local repo on HDD /data/cold/backups, ~14 days (weekly full + daily incr)
# Layer 3: Cloudflare R2 (repo2) — template at bottom, needs credentials

[global]
repo1-path=/backups
repo1-retention-full=2
repo1-retention-diff=6
repo1-bundle=y
repo1-block=y
compress-type=zst
compress-level=3
process-max=2
start-fast=y
delta=y
archive-async=y
spool-path=/var/spool/pgbackrest
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[global:archive-push]
compress-level=3

[vpnhub]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=vpnhub
pg1-database=vpnhub

# ---------------------------------------------------------------------------
# Layer 3 — Cloudflare R2 offsite (design 4.5, 30-day retention). To enable:
#   1. Create R2 bucket + API token (Access Key ID / Secret)
#   2. Add to [global] above:
#        repo2-type=s3
#        repo2-path=/vpnhub
#        repo2-s3-bucket=<bucket>
#        repo2-s3-endpoint=<accountid>.r2.cloudflarestorage.com
#        repo2-s3-region=auto
#        repo2-s3-uri-style=path
#        repo2-s3-key=<ACCESS_KEY_ID>
#        repo2-s3-key-secret=<SECRET_ACCESS_KEY>
#        repo2-retention-full=4
#   3. pgbackrest --stanza=vpnhub --repo=2 stanza-create
# ---------------------------------------------------------------------------
