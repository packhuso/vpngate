#!/usr/sbin/nft -f
# VPN Hub SSTP gateway (gw-3) — TCP MSS clamping. MSS-clamp only (policy accept),
# safe to apply on a node with no prior firewall. SSTP clients land on dynamic
# ppp* interfaces, so match the wildcard. ppp MTU is 1400 and SSTP adds TLS/TCP
# overhead, so clamp TCP MSS to 1360.
flush ruleset

table inet filter {
    chain mangle_fwd {
        type filter hook forward priority mangle; policy accept;
        iifname "ppp*" tcp flags syn tcp option maxseg size set 1360
        oifname "ppp*" tcp flags syn tcp option maxseg size set 1360
    }
}
