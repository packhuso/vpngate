! VPN Hub — FRR eBGP config for the SSTP node (gw-3, AS 65003).
! Announces ONLY customer pool prefixes to the Mikrotik gateway (AS 65000) and
! accepts nothing inbound (node keeps its static default). Apply with:
!   vtysh -f frr-bgp-gw3.conf   (set bgpd=yes in /etc/frr/daemons first)
!
! NOTE vs gw-1/gw-2: SSTP clients land on dynamic ppp interfaces, so there's no
! fixed `match interface` to exclude the pool blackhole route. Instead the SSTP
! node carries NO blackhole at all (drift skips it on bgp_enabled nodes — BGP
! already announces only allocated /32s, so Mikrotik drops unallocated IPs). The
! prefix-list (sub-prefixes of each pool /24) is therefore sufficient on its own.
ip prefix-list VPN-POOLS seq 5 permit 104.238.11.0/24 ge 25
ip prefix-list VPN-POOLS seq 10 permit 216.132.69.0/24 ge 25
!
route-map ANNOUNCE-POOLS permit 10
 match ip address prefix-list VPN-POOLS
!
route-map DENY-ALL deny 10
!
router bgp 65003
 bgp router-id 185.213.250.92
 no bgp network import-check
 neighbor 185.213.250.89 remote-as 65000
 neighbor 185.213.250.89 description mikrotik-gw
 neighbor 185.213.250.89 timers 10 30
 address-family ipv4 unicast
  ! pppd installs each client's public /32s as kernel routes (dev pppN);
  ! redistribute them, filtered to pool prefixes.
  redistribute kernel route-map ANNOUNCE-POOLS
  neighbor 185.213.250.89 next-hop-self force
  neighbor 185.213.250.89 route-map ANNOUNCE-POOLS out
  neighbor 185.213.250.89 route-map DENY-ALL in
 exit-address-family
