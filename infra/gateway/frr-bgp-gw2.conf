! VPN Hub — FRR eBGP config for the OpenVPN node (gw-2, AS 65002).
! Announces ONLY customer pool prefixes (block CIDRs + /32 singles) to the
! Mikrotik gateway (AS 65000) and accepts NOTHING in return — the node keeps its
! static default route. Apply with:  vtysh -f frr-bgp-gw2.conf  (bgpd=yes first).
!
! Pool source-of-truth lives in the prefix-list: add a line per pool /24.
! `ge 25` = accept any sub-prefix /25../32 (all block sizes + singles), never the
! bare /24 (a node must never announce a whole pool).
ip prefix-list VPN-POOLS seq 5 permit 104.238.11.0/24 ge 25
ip prefix-list VPN-POOLS seq 10 permit 216.132.69.0/24 ge 25
!
route-map ANNOUNCE-POOLS permit 10
 match ip address prefix-list VPN-POOLS
 ! only routes pointing INTO the tunnel — excludes the pool blackhole route
 ! (type unreachable, no interface) which must NOT be announced (it would pull
 ! the whole pool CIDR to this node).
 match interface tun0
!
route-map DENY-ALL deny 10
!
router bgp 65002
 bgp router-id 185.213.250.91
 no bgp network import-check
 neighbor 185.213.250.89 remote-as 65000
 neighbor 185.213.250.89 description mikrotik-gw
 neighbor 185.213.250.89 timers 10 30
 address-family ipv4 unicast
  ! the agent installs customer /32s + block CIDRs as kernel routes on wg0/tun0;
  ! redistribute them, filtered to pool prefixes only.
  redistribute kernel route-map ANNOUNCE-POOLS
  neighbor 185.213.250.89 route-map ANNOUNCE-POOLS out
  neighbor 185.213.250.89 route-map DENY-ALL in
 exit-address-family
