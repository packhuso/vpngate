#!/usr/sbin/nft -f
# VPN Hub OpenVPN gateway (gw-2) — TCP MSS clamping.
# NOTE: MSS-clamp only (policy accept) so it's safe to apply on a node with no
# prior firewall and can't lock anyone out. A full input firewall (mirroring
# the WireGuard node's nftables.conf, adapted for OpenVPN udp/1194 + BGP) is a
# separate hardening step.
flush ruleset

table inet filter {
    # tun0 reports MTU 1500, but OpenVPN's UDP + AES-GCM encapsulation (~70B)
    # shrinks the real path MTU, so a 1500-byte inner packet won't fit and gets
    # fragmented/dropped. Clamp TCP MSS (SYN only, both directions) to 1360 so
    # encapsulated packets stay under the 1500 wire MTU — fixes hung TCP / pages
    # that won't load when PMTUD is black-holed.
    chain mangle_fwd {
        type filter hook forward priority mangle; policy accept;
        iifname "tun0" tcp flags syn tcp option maxseg size set 1360
        oifname "tun0" tcp flags syn tcp option maxseg size set 1360
    }
}
