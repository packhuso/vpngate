#!/usr/sbin/nft -f
# VPN Hub gateway firewall (design Section 3.1 / 6.1 layer 1).
# SSH-safe: established + SSH accepted before anything restrictive.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif "lo" accept
        meta l4proto { icmp, icmpv6 } accept

        # SSH — Colo management subnet
        ip saddr 10.2.1.0/24 tcp dport 22 accept

        # Agent API :9443 — control plane / worker ONLY (design 6.1 layer 1).
        # mTLS + Bearer are layers 2-3 inside the app.
        ip saddr 10.2.1.3 tcp dport 9443 accept

        # WireGuard data plane — customers dial in here
        udp dport 51820 accept

        # everything else: dropped by policy
    }

    # MSS clamping — runs before the filter forward chain (mangle priority).
    # wg0 MTU is 1420, so TCP through the tunnel must cap MSS at 1420-40=1380.
    # Without this, PMTUD black-holes (ICMP blocked upstream) hang TCP sessions
    # / make sites fail to load. SYN-only, both directions across the tunnel.
    chain mangle_fwd {
        type filter hook forward priority mangle; policy accept;
        iifname "wg0" tcp flags syn tcp option maxseg size set 1380
        oifname "wg0" tcp flags syn tcp option maxseg size set 1380
    }

    chain forward {
        type filter hook forward priority filter; policy accept;
        ct state invalid drop

        # Peer isolation: drop traffic between WireGuard peers whose
        # destination is in the private subnet. Public IP traffic between
        # peers IS allowed (it routes back out the internet via the public
        # IP route table — design intent: peers can talk publicly only).
        iifname "wg0" oifname "wg0" ip daddr 10.99.0.0/24 drop

        # Pure-routing gateway forwards customer traffic. Per-IP egress
        # rate-limiting (design 6.6/11.2) is deferred for this LAN test gw.
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
