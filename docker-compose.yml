# VPN Hub — Core services (design Section 3.1, 4.2 memory budget, 4.3 storage)
# Hot data  -> /data/hot  (SSD, random I/O)
# Cold data -> /data/cold (HDD, sequential I/O)
#
# Security: only Caddy is published on 0.0.0.0 (80/443, allowed by UFW).
# All datastores/observability bind to 127.0.0.1 ONLY — Docker bypasses
# UFW, so loopback binding is what actually keeps them private.

name: vpnhub

networks:
  vpnhub:
    name: vpnhub

volumes:
  caddy_data:
  caddy_config:

services:
  # ---------------------------------------------------------------- PostgreSQL
  postgres:
    build:
      context: ./infra/docker/postgres
    image: vpnhub/postgres:16-pgbackrest
    container_name: vpnhub-postgres
    restart: unless-stopped
    networks: [vpnhub]
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=4GB
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=vpnhub archive-push %p
      - -c
      - archive_timeout=300
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=3
      - -c
      - effective_cache_size=8GB
      - -c
      - maintenance_work_mem=512MB
      - -c
      - work_mem=32MB
      - -c
      - max_connections=200
      - -c
      - wal_buffers=16MB
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=512MB
    volumes:
      - /data/hot/postgres:/var/lib/postgresql/data
      - /data/cold/backups:/backups
      - ./infra/pgbackrest:/etc/pgbackrest:ro
    ports:
      - "127.0.0.1:5432:5432"
    shm_size: "1gb"
    mem_limit: 5g
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --------------------------------------------------------------------- Redis
  redis:
    image: redis:7-alpine
    container_name: vpnhub-redis
    restart: unless-stopped
    networks: [vpnhub]
    env_file: .env
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --dir
      - /data
    volumes:
      - /data/hot/redis:/data
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 1200m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --------------------------------------------------------------------- Caddy
  caddy:
    image: caddy:2
    container_name: vpnhub-caddy
    restart: unless-stopped
    networks: [vpnhub]
    env_file: .env
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN}
      CADDY_EMAIL: ${CADDY_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    mem_limit: 200m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------- Prometheus
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: vpnhub-prometheus
    restart: unless-stopped
    networks: [vpnhub]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=40GB
      - --web.enable-lifecycle
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /data/cold/prometheus:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 500m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------- Loki
  loki:
    image: grafana/loki:3.3.2
    container_name: vpnhub-loki
    restart: unless-stopped
    networks: [vpnhub]
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./config/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - /data/cold/loki:/loki
    ports:
      - "127.0.0.1:3100:3100"
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready | grep -q ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ------------------------------------------------------------------ Promtail
  promtail:
    image: grafana/promtail:3.3.2
    container_name: vpnhub-promtail
    restart: unless-stopped
    networks: [vpnhub]
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./config/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /tmp/promtail:/tmp
    depends_on:
      loki:
        condition: service_started
    mem_limit: 128m
    cpus: 0.25

  # ------------------------------------------------------------------- Grafana
  grafana:
    image: grafana/grafana:11.4.0
    container_name: vpnhub-grafana
    restart: unless-stopped
    networks: [vpnhub]
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_HTTP_ADDR: "0.0.0.0"
    volumes:
      - /data/cold/grafana:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
    mem_limit: 384m
    cpus: 0.5
